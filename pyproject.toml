[project]
name = "lnreader-remote-service-container"
version = "0.3.0"
description = "Container-focused LNReader Remote Service"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
  "gunicorn==26.2.0",
  "packaging==26.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
addopts = "-ra -vv"
testpaths = ["tests"]
