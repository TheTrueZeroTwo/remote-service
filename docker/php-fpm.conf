[global]
pid = /run/lnreader/php-fpm.pid
error_log = /run/lnreader/php-fpm.error.log
daemonize = no

[www]
user = lnreader
group = lnreader
listen = 127.0.0.1:9000
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 250
catch_workers_output = yes
clear_env = yes
env[LNREADER_STORAGE_DIR] = $LNREADER_STORAGE_DIR
env[LNREADER_RUNTIME_DIR] = $LNREADER_RUNTIME_DIR
env[WEB_UI_SLUG] = $WEB_UI_SLUG
env[PUBLIC_URL] = $PUBLIC_URL
env[APP_VERSION] = $APP_VERSION

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_value[open_basedir] = /app/web:/home/lnreader/.LNReader:/run/lnreader:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv
