[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/lnreader/supervisord.pid
childlogdir=/run/lnreader

[program:gunicorn]
command=/usr/local/bin/gunicorn --config /app/docker/gunicorn.conf.py src.server.server:app
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=10
stopasgroup=true
killasgroup=true
stdout_logfile=/run/lnreader/gunicorn.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/run/lnreader/gunicorn.stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 --nodaemonize --fpm-config /app/docker/php-fpm.conf
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/run/lnreader/php-fpm.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/run/lnreader/php-fpm.stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:nginx]
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/run/lnreader/nginx.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/run/lnreader/nginx.stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
