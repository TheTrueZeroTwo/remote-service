services:
  lnreader:
    image: ${LNREADER_IMAGE:-ghcr.io/thetruezerotwo/remote-service:v0.3.0}
    environment:
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      WORKERS: "${WORKERS:-2}"
      THREADS: "${THREADS:-2}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      FIX_PERMISSIONS: "${FIX_PERMISSIONS:-true}"
      WEB_UI_SLUG: "${WEB_UI_SLUG:-lnr-vault-7f3c9}"
      WEB_UI_USERNAME: "${WEB_UI_USERNAME:-admin}"
      WEB_UI_PASSWORD: "${WEB_UI_PASSWORD:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      MAX_UPLOAD_SIZE: "${MAX_UPLOAD_SIZE:-20g}"
    volumes:
      - type: bind
        source: ${STORAGE_PATH:-./data}
        target: /home/lnreader/.LNReader
    ports:
      - "${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
